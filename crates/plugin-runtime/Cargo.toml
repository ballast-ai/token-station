[package]
name = "token-station-plugin-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Match the workspace declaration; the lockfile and Windows build gate require at least 1.96.
rust-version = "1.96"
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
token-station-conformance = { path = "../conformance" }
token-station-plugin-api = { path = "../plugin-api" }
token-station-protocol = { path = "../protocol" }
wasmtime = { version = "46", default-features = false, features = [
    "runtime",
    "component-model",
    "cranelift",
    # Compilation cache: compiling each WASM component with Cranelift on every
    # start takes seconds. Persist the built-in cache by content and config hash,
    # then deserialize on restart; unsafe code remains inside wasmtime.
    "cache",
    # Tests use handwritten WAT for a component importing wasi:sockets to prove
    # the rejection path. Production loads binary .wasm without WAT.
    "wat",
] }
wasmtime-wasi = "46"

[lints]
workspace = true

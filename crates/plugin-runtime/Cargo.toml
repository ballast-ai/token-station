[package]
name = "token-station-plugin-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Match the workspace declaration; the lockfile and Windows build gate require at least 1.95.
rust-version = "1.95"
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
token-station-conformance = { path = "../conformance" }
token-station-plugin-api = { path = "../plugin-api" }
token-station-protocol = { path = "../protocol" }
wasmtime = { version = "46", default-features = false, features = [
    "runtime",
    "component-model",
    "cranelift",
    # Compilation cache: compiling each WASM component with Cranelift at every start takes several seconds per component and dominates startup.
    # The built-in cache stores content and config hashes on disk and deserializes them after restart. All unsafe code remains inside wasmtime.
    "cache",
    # Tests use handwritten WAT for a component importing wasi:sockets to prove
    # the rejection path. Production loads binary .wasm without WAT.
    "wat",
] }
wasmtime-wasi = "46"

[lints]
workspace = true

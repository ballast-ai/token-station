[package]
name = "token-station-plugin-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Above the workspace floor because of the wasmtime 46 MSRV. Do not raise the floor because third parties must
# Low-dependency crates such as protocol, plugin-api, and conformance do not depend on wasmtime.
rust-version = "1.94"
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
token-station-conformance = { path = "../conformance" }
token-station-plugin-api = { path = "../plugin-api" }
token-station-protocol = { path = "../protocol" }
wasmtime = { version = "46", default-features = false, features = [
    "runtime",
    "component-model",
    "cranelift",
    # Tests use handwritten WAT for a component importing wasi:sockets to prove
    # the rejection path. Production loads binary .wasm without WAT.
    "wat",
] }
wasmtime-wasi = "46"

[lints]
workspace = true

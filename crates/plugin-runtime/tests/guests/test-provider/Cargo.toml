# The runtime's test guest: a real wasm32-wasip2 component, built by the test
# harness as a child cargo invocation. Excluded from the parent workspace
# because it compiles for a different target.
[package]
name = "test-provider"
version = "1.0.0"
edition = "2021"
publish = false

# Standalone: stops cargo from walking up into the main workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.59"

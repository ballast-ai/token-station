# cargo-deny gate (C0#6). CI runs `cargo deny check` on every PR.
#
# This Apache-2.0 open-core repository will be consumed by third-party crates;
# conformance will become a pinned plugin dependency under architecture section
# 9.1. Use an explicit license allowlist so CI rejects new licenses and a person
# chooses whether to extend the list or replace the dependency before release.

[graph]
# Check all targets. The client ships on macOS, Windows, and Linux, so host-only
# checks would miss platform-specific dependencies such as keyrings and TLS stacks.
all-features = true

[licenses]
# Deliberately small set of Apache-2.0-compatible licenses present in the current
# dependency tree. Every addition must be an explicit decision.
allow = [
    "Apache-2.0",
    # The wasmtime family used by plugin-runtime offers only this license.
    "Apache-2.0 WITH LLVM-exception",
    # encoding_rs is `(Apache-2.0 OR MIT) AND BSD-3-Clause`; the AND is unavoidable.
    "BSD-3-Clause",
    # License for webpki-roots, Mozilla's root-certificate dataset used by rustls.
    "CDLA-Permissive-2.0",
    # rustls-webpki and untrusted; ring is `Apache-2.0 AND ISC`, so this satisfies the AND.
    "ISC",
    "MIT",
    # unicode-ident under proc-macro2, syn, and serde_derive, plus the ICU family.
    "Unicode-3.0",
    # foldhash, the default hashbrown hasher and a transitive wit-parser dependency.
    "Zlib",
]
# Deliberately excluded: r-efi offers `MIT OR Apache-2.0 OR LGPL-2.1-or-later`,
# and mach2 offers `BSD-2-Clause OR MIT OR Apache-2.0`. cargo-deny can select an
# already allowed option, so LGPL and BSD-2-Clause need not be added. Reject
# missing or unparseable license fields as low confidence instead of guessing.
confidence-threshold = 0.9

[bans]
# Warn but do not block duplicate crate versions because transitive duplication
# is often outside our control and upstream releases should not break unrelated PRs.
multiple-versions = "warn"
# Reject wildcard versions except workspace-internal path dependencies, which normally have no version.
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
# RustSec advisories fail on vulnerabilities or yanked releases. Report
# unmaintained direct dependencies only; handle transitive ones through bans and upgrades.
unmaintained = "workspace"
yanked = "deny"

[sources]
# Trust crates.io only. Git dependencies create a non-reproducible trust chain that conflicts with C1#7.
unknown-registry = "deny"
unknown-git = "deny"

[workspace]
resolver = "2"
members = [
    "apps/cli",
    "crates/conformance",
    "crates/metrics",
    "crates/plugin-api",
    "crates/plugin-runtime",
    "crates/private-fs",
    "crates/protocol",
    "crates/release",
    "crates/router-core",
]
# The WASM guest packages under `plugins/official/` need no entry here: each
# declares its own empty `[workspace]` table, which stops cargo walking up to
# this manifest. They target wasm32-wasip2 and are built in cargo subprocesses
# by plugin-runtime's tests and by scripts/build-release.sh.
exclude = [
    # Deliberately exclude the Tauri desktop app from the strict workspace so its
    # large GUI dependency tree does not enter clippy-pedantic or cargo-deny gates.
    # Its path dependency on token-station-cli reuses the core without a fork.
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ballast-ai/token-station"
rust-version = "1.96"
# Path dependencies without versions cannot pass `cargo publish`; this merely
# states that fact so cargo-deny can allow workspace-internal dependencies. When
# conformance becomes an independent release artifact under architecture section
# 9.1, flip this flag and add dependency versions so wildcard checks begin then.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
south-contracts = { version = "=0.57.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "bc07c516e3488b321eabf3a67e6a650ecbd6eeda" }
south-core = { version = "=0.88.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "bc07c516e3488b321eabf3a67e6a650ecbd6eeda" }
south-component-conformance = { version = "=0.82.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "bc07c516e3488b321eabf3a67e6a650ecbd6eeda" }
south-host-grammars = { version = "=0.88.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "bc07c516e3488b321eabf3a67e6a650ecbd6eeda" }
south-provider-conformance = { version = "=0.88.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "bc07c516e3488b321eabf3a67e6a650ecbd6eeda" }
south-testkit = { version = "=0.88.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "bc07c516e3488b321eabf3a67e6a650ecbd6eeda" }
south-transport-reqwest = { version = "=0.88.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "bc07c516e3488b321eabf3a67e6a650ecbd6eeda" }
south-provider-api = { version = "=0.66.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "bc07c516e3488b321eabf3a67e6a650ecbd6eeda" }
south-provider-runtime = { version = "=0.88.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "bc07c516e3488b321eabf3a67e6a650ecbd6eeda" }

# South compiles against the kernel mirror's protocol crate, which is this
# repository's crates/protocol published one way (token-station-kernel). Two
# copies of byte-identical source are still two Rust types, so host code could
# not pass its requests and configs to a South function. This patch makes South
# build against the source itself: one type set for the host and South.
# tests/south-dependency-policy.mjs requires crates/protocol to stay
# byte-identical to the mirror revision South pins, so a local IR change cannot
# reach South before the mirror and South release it.
[patch."https://github.com/ballast-ai/token-station-kernel.git"]
token-station-protocol = { path = "crates/protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Rust 1.99 added `assert_is_empty`. Its suggested `assert_eq!(x, [] as [T; 0])` is harder to read
# than `assert!(x.is_empty())`, and crates/router-core is frozen, so its hits cannot change in place.
assert_is_empty = "allow"


# Release determinism and size: one codegen unit, thin LTO, and stripped symbols.
# See scripts/build-release.sh for toolchain pinning, path remapping, and deterministic packaging.
[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

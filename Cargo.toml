[workspace]
resolver = "2"
members = [
    "apps/cli",
    "crates/conformance",
    "crates/metrics",
    "crates/plugin-api",
    "crates/plugin-runtime",
    "crates/private-fs",
    "crates/protocol",
    "crates/release",
    "crates/router-core",
]
# The WASM guest packages under `plugins/official/` need no entry here: each
# declares its own empty `[workspace]` table, which stops cargo walking up to
# this manifest. They target wasm32-wasip2 and are built in cargo subprocesses
# by plugin-runtime's tests and by scripts/build-release.sh.
exclude = [
    # Deliberately exclude the Tauri desktop app from the strict workspace so its
    # large GUI dependency tree does not enter clippy-pedantic or cargo-deny gates.
    # Its path dependency on token-station-cli reuses the core without a fork.
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ballast-ai/token-station"
rust-version = "1.96"
# Path dependencies without versions cannot pass `cargo publish`; this merely
# states that fact so cargo-deny can allow workspace-internal dependencies. When
# conformance becomes an independent release artifact under architecture section
# 9.1, flip this flag and add dependency versions so wildcard checks begin then.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
south-contracts = { version = "=0.20.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "7afe9a5b8ce80246597c43f7dd1b285b67eef9ed" }
south-core = { version = "=0.20.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "7afe9a5b8ce80246597c43f7dd1b285b67eef9ed" }
south-component-conformance = { version = "=0.20.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "7afe9a5b8ce80246597c43f7dd1b285b67eef9ed", features = ["sandbox"] }
south-provider-conformance = { version = "=0.20.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "7afe9a5b8ce80246597c43f7dd1b285b67eef9ed" }
south-testkit = { version = "=0.20.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "7afe9a5b8ce80246597c43f7dd1b285b67eef9ed" }
south-transport-reqwest = { version = "=0.20.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "7afe9a5b8ce80246597c43f7dd1b285b67eef9ed" }
south-provider-api = { version = "=0.20.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "7afe9a5b8ce80246597c43f7dd1b285b67eef9ed" }
south-provider-runtime = { version = "=0.20.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "7afe9a5b8ce80246597c43f7dd1b285b67eef9ed" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Rust 1.99 added `assert_is_empty`. Its suggested `assert_eq!(x, [] as [T; 0])` is harder to read
# than `assert!(x.is_empty())`, and crates/router-core is frozen, so its hits cannot change in place.
assert_is_empty = "allow"


# Release determinism and size: one codegen unit, thin LTO, and stripped symbols.
# See scripts/build-release.sh for toolchain pinning, path remapping, and deterministic packaging.
[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

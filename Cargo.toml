[workspace]
resolver = "2"
members = [
    "apps/cli",
    "crates/conformance",
    "crates/metrics",
    "crates/plugin-api",
    "crates/plugin-runtime",
    "crates/protocol",
    "crates/router-core",
]
# WASM guest 测试件：目标是 wasm32-wasip2，不能进主 workspace 的构建图。
# plugin-runtime 的测试用子进程 cargo 构建它。
exclude = [
    "crates/plugin-runtime/tests/guests/test-provider",
    "plugins/official/agent-openai",
    "plugins/official/provider-openai-compatible",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/GlimpseEngine/token-station"
rust-version = "1.85"
# 版本号缺失的 path 依赖本来就过不了 `cargo publish`，这里只是把事实声明出来，
# 让 cargo-deny 的 wildcard 检查得以对 workspace 内部依赖放行。到 conformance
# 需要作为独立发布物拆出去那天（架构 §9.1），翻转此标志并给依赖补版本号——
# wildcard 检查从那一刻起开始把关，正合适。
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"


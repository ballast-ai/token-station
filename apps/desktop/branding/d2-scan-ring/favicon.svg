<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none"><title>Token Station — D2 Scan Ring — Favicon</title><desc>Bold T crossed by an ascending route, with segmented scan rings at both terminals.</desc>

[package]
name = "token-station-desktop"
version = "1.3.1"
description = "token-station — 本地智能路由代理的桌面客户端"
authors = ["token-station"]
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
# Official desktop artifacts enable this feature through scripts/build-desktop.sh.
# It compiles the four trusted adapters into the executable; ordinary unit tests
# keep it disabled so they do not require a staged WASI plugin directory.
bundled-plugins = ["token-station-cli/builtin-plugins"]

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin on Windows.
name = "token_station_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri does not embed the common-controls-v6 manifest into Windows test EXEs.
# Keep the other defaults explicit so `cargo test` remains runnable on Windows.
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl", "x11", "dbus", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
json-five = "=0.3.1"
serde_norway = "=0.9.42"
yaml-edit = "=0.2.3"
toml = "0.8"
toml_edit = "=0.20.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
axum = "=0.8.9"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
ureq = { version = "3.3.0", features = ["socks-proxy"] }
semver = "=1.0.28"
sha2 = "=0.10.9"
command-group = { version = "=5.0.1", default-features = false }
getrandom = "=0.4.3"
ring = "=0.17.14"
subtle = "=2.6.1"
rusqlite = "=0.40.1"
zeroize = "=1.9.0"
flate2 = "=1.1.9"
tar = "=0.4.46"

# The kernel, reused as a library — routing / gateway / config / metrics /
# keychain all come from here. No fork of any of it.
token-station-cli = { path = "../../cli" }
token-station-protocol = { path = "../../../crates/protocol" }
token-station-router-core = { path = "../../../crates/router-core" }
token-station-metrics = { path = "../../../crates/metrics" }
token-station-private-fs = { path = "../../../crates/private-fs" }

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["ApplicationModel", "Management_Deployment", "Storage_Search", "Win32_System_WinRT"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }

[target.'cfg(target_os = "macos")'.dependencies]
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc", "block-padding"] }
pbkdf2 = "=0.12.2"
sha1 = "=0.10.6"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

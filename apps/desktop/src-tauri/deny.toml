# The desktop crate is intentionally outside the root Cargo workspace, so it
# needs its own complete cargo-deny policy. Keep this file explicit: desktop
# dependencies include Tauri's platform graph and must not silently inherit a
# policy that was evaluated against a different lockfile.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # Tauri's HTML/CSS parser stack uses MPL-2.0. This weak-copyleft license
    # is isolated to upstream dependency files; token-station does not modify
    # or relicense them.
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
unmaintained = "workspace"
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

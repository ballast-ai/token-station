[package]
name = "token-station-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
getrandom = "0.4.3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
token-station-conformance = { path = "../../crates/conformance" }
token-station-metrics = { path = "../../crates/metrics" }
token-station-plugin-runtime = { path = "../../crates/plugin-runtime" }
token-station-protocol = { path = "../../crates/protocol" }
token-station-router-core = { path = "../../crates/router-core" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "signal"] }
tokio-stream = "0.1.18"
ureq = "3.3.0"

# The OS keychain, one backend per platform. Linux uses the desktop
# secret-service over D-Bus; headless boxes fall back to `auth.file`.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[lints]
workspace = true


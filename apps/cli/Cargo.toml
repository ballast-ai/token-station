[package]
name = "token-station-cli"
version = "1.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]

# 共享核心固定源码提交；组件运行时保持独立的正式版本。
south-task-core = { git = "https://github.com/ballast-ai/token-station-south.git", rev = "b29d6810cc66e64b9a399f9d76e228093749b260" }
south-component-conformance = { git = "https://github.com/ballast-ai/token-station-south.git", tag = "v0.31.0", features = ["sandbox"] }
south-contracts = { git = "https://github.com/ballast-ai/token-station-south.git", tag = "v0.31.0" }
south-provider-api = { git = "https://github.com/ballast-ai/token-station-south.git", tag = "v0.31.0" }
south-provider-runtime = { git = "https://github.com/ballast-ai/token-station-south.git", tag = "v0.31.0" }
task-protocol = { package = "token-station-protocol", git = "https://github.com/ballast-ai/token-station-kernel.git", rev = "ab6bb2ffaab534e6732d1bfc53d24c7caa51fa35" }
hmac = "0.12"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
token-station-private-fs = { path = "../../crates/private-fs" }
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
getrandom = "0.4.3"
pdf-extract = "0.12.0"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
token-station-conformance = { path = "../../crates/conformance" }
token-station-metrics = { path = "../../crates/metrics" }
token-station-plugin-api = { path = "../../crates/plugin-api" }
token-station-plugin-runtime = { path = "../../crates/plugin-runtime" }
token-station-protocol = { path = "../../crates/protocol" }
token-station-release = { path = "../../crates/release" }
token-station-router-core = { path = "../../crates/router-core" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "signal"] }
tokio-stream = "0.1.18"
ureq = { version = "=3.3.0", features = ["socks-proxy"] }
# Explicit handle on ureq's TLS stack: rustls for downcasting certificate
# verification failures into actionable errors, webpki-root-certs for the
# full-DER Mozilla roots merged with operator-supplied extra CAs (ureq's
# RootCerts::Specific replaces the store, so the defaults must be re-added).
rustls = { version = "0.23", default-features = false, features = ["std"] }
webpki-root-certs = "1.0"

# Unix file-permission primitives (0600 on the local secrets store, etc.).
# Credentials live in a local file across all platforms — no OS keychain — so
# there are no per-OS credential backends to declare here.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# The builtin plugin tier (architecture section 12.1): the release pipeline embeds the
# official adapter packages via TOKEN_STATION_PLUGINS_DIST (see build.rs).
# An artifact-assembly switch, not a product tier — those are forbidden at
# compile time.
builtin-plugins = []

[lints]
workspace = true

[dev-dependencies]
south-task-conformance = { git = "https://github.com/ballast-ai/token-station-south.git", rev = "b29d6810cc66e64b9a399f9d76e228093749b260" }

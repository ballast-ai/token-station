[package]
name = "token-station-cli"
version = "1.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
token-station-private-fs = { path = "../../crates/private-fs" }
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
getrandom = "0.4.3"
pdf-extract = "0.12.0"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
south-contracts = { workspace = true }
south-core = { workspace = true }
south-provider-api = { workspace = true }
south-provider-runtime = { workspace = true }
south-transport-reqwest = { workspace = true }
token-station-conformance = { path = "../../crates/conformance" }
token-station-metrics = { path = "../../crates/metrics" }
token-station-plugin-api = { path = "../../crates/plugin-api" }
token-station-plugin-runtime = { path = "../../crates/plugin-runtime" }
token-station-protocol = { path = "../../crates/protocol" }
token-station-release = { path = "../../crates/release" }
token-station-router-core = { path = "../../crates/router-core" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "signal"] }
tokio-stream = "0.1.18"
tokio-util = "0.7"
ureq = { version = "=3.3.0", features = ["socks-proxy"] }
url = "2.5"

# Unix file-permission primitives (0600 on the local secrets store, etc.).
# Credentials live in a local file across all platforms — no OS keychain — so
# there are no per-OS credential backends to declare here.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
south-component-conformance = { workspace = true }
south-provider-conformance = { workspace = true }
south-testkit = { workspace = true }
tokio = { version = "1.52.3", features = ["test-util"] }

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# The builtin plugin tier (architecture section 12.1): the release pipeline embeds the
# official adapter packages via TOKEN_STATION_PLUGINS_DIST (see build.rs).
# An artifact-assembly switch, not a product tier — those are forbidden at
# compile time.
builtin-plugins = []

[lints]
workspace = true

name: Router Core Redline

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # pull_request_target loads the workflow from the target branch. The trusted directory checks out only the target
  # Branch script. The candidate directory provides only Git objects and never runs its code.
  pull-request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted checker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout candidate history without executing it
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.number }}/head
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce event-range and frozen-baseline gates
        working-directory: candidate
        run: >-
          bash ../trusted/scripts/check-router-core-redline.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  main-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce event-range and frozen-baseline gates
        run: >-
          bash scripts/check-router-core-redline.sh
          "${{ github.event.before }}"
          "${{ github.event.after }}"

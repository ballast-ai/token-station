# Formal binary release pipeline (C1#7). When explicitly enabled, a v* tag
# builds four CLI platforms and two macOS desktop targets, proves CLI
# reproducibility, and creates one draft release.
#
# The workflow receives Apple distribution credentials but no long-term release
# private key. Maintainers use the three formal-release scripts to transfer,
# sign, verify, and publish the draft.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "formal builds and publishes; source-only deliberately skips artifacts"
        type: choice
        required: true
        options: [source-only, formal]
      release_tag:
        description: "existing vX.Y.Z tag to resume after a workflow-only failure"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

env:
  TOKEN_STATION_RELEASE_PUBKEY_HEX: ${{ vars.TOKEN_STATION_RELEASE_PUBKEY_HEX }}
  TOKEN_STATION_UPDATER_PUBKEY: ${{ vars.TOKEN_STATION_UPDATER_PUBKEY }}

jobs:
  # A tag push uses its own immutable target. A manual formal run is only a
  # recovery path for an existing version tag: it resolves that tag to a commit,
  # proves the commit is on main, and makes every build check out that exact SHA.
  release-target:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: target
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]] || {
              echo "::error::Release push must be a v* tag." >&2
              exit 1
            }
            tag="$GITHUB_REF_NAME"
          elif [[ "$REQUESTED_MODE" == "formal" ]]; then
            [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::Manual formal recovery requires release_tag=vX.Y.Z." >&2
              exit 1
            }
            tag="$REQUESTED_TAG"
          else
            tag=""
            sha="$GITHUB_SHA"
          fi

          if [[ -n "$tag" ]]; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag" || {
              echo "::error::The requested release tag does not exist: $tag" >&2
              exit 1
            }
            [[ "$(git cat-file -t "$tag")" == "tag" ]] || {
              echo "::error::Formal release tags must be annotated: $tag" >&2
              exit 1
            }
            sha=$(git rev-parse "$tag^{}")
            git merge-base --is-ancestor "$sha" origin/main || {
              echo "::error::Release target $sha is not on main." >&2
              exit 1
            }
            version=$(git show "$sha:apps/desktop/package.json" | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')
            [[ "$tag" == "v$version" ]] || {
              echo "::error::Release tag $tag does not match version $version." >&2
              exit 1
            }
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # A tag is releasable only once full-ci.yml has already passed for this exact
  # commit on main. Re-running it here would cost a second full Linux gate for a
  # revision that main has verified, so assert the recorded run instead.
  #
  # Both conditions matter. head_sha pins the assertion to this commit, so a tag
  # cut from an older commit or a main that was force-pushed past this revision
  # finds no run. event=push excludes runs this workflow itself started through
  # workflow_call, which would otherwise let a release vouch for itself.
  verify-main-full-ci:
    needs: release-target
    runs-on: ubuntu-24.04
    steps:
      - name: Require a successful full-ci run for this commit on main
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.release-target.outputs.sha }}
        run: |
          conclusion=$(gh api \
            --method GET \
            "repos/${{ github.repository }}/actions/workflows/full-ci.yml/runs" \
            -f "head_sha=$COMMIT" -f branch=main -f event=push -f per_page=100 \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [[ "$conclusion" == "0" ]]; then
            echo "::error::提交 $COMMIT 在 main 上没有成功的 full-ci 记录，无法发布。" >&2
            echo "请确认：标签指向的提交已合并进 main 且 full-ci 已跑通；" >&2
            echo "若 main 曾被强制推送，请重新触发 full-ci（workflow_dispatch）后再发布。" >&2
            exit 1
          fi
          echo "已确认提交 $COMMIT 在 main 上通过 full-ci。"

  platform-gates:
    needs: release-target
    uses: ./.github/workflows/platform.yml
    with:
      checkout_ref: ${{ needs.release-target.outputs.sha }}
      legacy_v2_windows_path_test_compat: ${{ needs.release-target.outputs.tag == 'v2.0.0' }}

  linux-desktop:
    needs: [release-target, verify-main-full-ci, platform-gates]
    uses: ./.github/workflows/linux-desktop.yml
    # A called workflow sees its own `inputs`, not the caller's. Without this
    # a manual source-only release run would reach the callee with no mode and
    # be refused for not asking explicitly.
    with:
      mode: ${{ inputs.mode }}
      checkout_ref: ${{ needs.release-target.outputs.sha }}

  # A `v*` tag fails closed: the run stops here and names what is missing,
  # rather than skipping every real job and reporting green.
  release-mode:
    needs: release-target
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.mode.outputs.formal }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-target.outputs.sha }}
      - id: mode
        env:
          TS_EVENT: ${{ github.event_name }}
          TS_REF: ${{ github.ref }}
          TS_REQUESTED_MODE: ${{ inputs.mode }}
          TS_REQUIRED: >-
            TOKEN_STATION_FORMAL_ARTIFACTS_ENABLED,
            TOKEN_STATION_RELEASE_PUBKEY_HEX,
            TOKEN_STATION_UPDATER_PUBKEY,
            APPLE_CERTIFICATE,
            APPLE_SIGNING_IDENTITY,
            APPLE_API_KEY_CONTENT
          # Presence only. A secret's value never reaches the process.
          TS_HAS_TOKEN_STATION_FORMAL_ARTIFACTS_ENABLED: ${{ vars.TOKEN_STATION_FORMAL_ARTIFACTS_ENABLED == 'true' }}
          TS_HAS_TOKEN_STATION_RELEASE_PUBKEY_HEX: ${{ vars.TOKEN_STATION_RELEASE_PUBKEY_HEX != '' }}
          TS_HAS_TOKEN_STATION_UPDATER_PUBKEY: ${{ vars.TOKEN_STATION_UPDATER_PUBKEY != '' }}
          TS_HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          TS_HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          TS_HAS_APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT != '' }}
        run: node scripts/resolve-release-mode.mjs
      - name: Require Windows Authenticode configuration after v2.0.0
        if: steps.mode.outputs.formal == 'true' && needs.release-target.outputs.tag != 'v2.0.0'
        env:
          TS_EVENT: workflow_dispatch
          TS_REQUESTED_MODE: formal
          TS_REQUIRED: WINDOWS_CERTIFICATE,WINDOWS_CERTIFICATE_PASSWORD,WINDOWS_TIMESTAMP_URL
          TS_HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
          TS_HAS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          TS_HAS_WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL != '' }}
        run: node scripts/resolve-release-mode.mjs

  build:
    needs: [release-target, release-mode, verify-main-full-ci, platform-gates]
    if: needs.release-mode.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-apple-darwin, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-target.outputs.sha }}
      - name: Check tag, version, and public release key
        env:
          RELEASE_TAG: ${{ needs.release-target.outputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/cli/Cargo.toml | head -1)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "发布标签 $RELEASE_TAG 与 CLI 版本 $version 不一致。" >&2
            exit 1
          fi
          node scripts/check-release-readiness.mjs --version "$version" --formal
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # bsdtar lacks the ordering and timestamp controls required here.
      - if: runner.os == 'macOS'
        run: brew install gnu-tar
      - run: scripts/build-release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Rebuild the same recipe from clean trees and require byte identity.
  reproducibility:
    needs: [release-target, release-mode, verify-main-full-ci, platform-gates]
    if: needs.release-mode.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-target.outputs.sha }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build twice from clean trees, compare bytes
        run: |
          scripts/build-release.sh x86_64-unknown-linux-gnu
          sha256sum dist/*.tar.gz | tee first.sum
          rm -rf dist target plugins/official/agent-openai/target plugins/official/agent-anthropic/target plugins/official/agent-openai-responses/target plugins/official/agent-gemini/target plugins/official/provider-openai-compatible-v2/target plugins/official/provider-anthropic-v2/target
          scripts/build-release.sh x86_64-unknown-linux-gnu
          sha256sum -c first.sum

  desktop-macos:
    needs: [release-target, release-mode, verify-main-full-ci, platform-gates]
    if: needs.release-mode.outputs.enabled == 'true'
    name: Desktop macOS (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
    steps:
      - name: Check out the trusted release automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Stage the macOS identity importer
        run: /usr/bin/install -m 0700 scripts/import-macos-signing-identity.sh "$RUNNER_TEMP/import-macos-signing-identity.sh"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2,${{ matrix.target }}
      - run: npm --prefix apps/desktop ci
      - name: Check formal desktop metadata and DMG policy
        env:
          RELEASE_TAG: ${{ needs.release-target.outputs.tag }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "发布标签 $RELEASE_TAG 与桌面版本 $version 不一致。" >&2
            exit 1
          fi
          node scripts/check-release-readiness.mjs --version "$version" --formal
          node scripts/check-macos-dmg-packaging.mjs
          test -n "$TOKEN_STATION_UPDATER_PUBKEY"
      - name: Generate an untrusted temporary updater bundler key
        run: |
          key_path="$RUNNER_TEMP/token-station-updater-ci.key"
          npx --prefix apps/desktop tauri signer generate --ci --force \
            --password temporary-ci-only --write-keys "$key_path" >/dev/null
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=temporary-ci-only" >> "$GITHUB_ENV"
      - name: Require Apple signing and notarization secrets
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_KEYCHAIN_PASSWORD"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_CONTENT"
      - name: Import Developer ID certificate
        run: "$RUNNER_TEMP/import-macos-signing-identity.sh"
      - name: Prepare App Store Connect key
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and audit
        run: scripts/build-desktop.sh --production --target "${{ matrix.target }}"
      - name: Stage flat desktop release inputs
        run: |
          mkdir desktop-dist
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg desktop-dist/
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz desktop-dist/
          test "$(find desktop-dist -type f | wc -l | tr -d ' ')" = 2
      - uses: actions/upload-artifact@v4
        with:
          name: token-station-desktop-${{ matrix.target }}
          path: desktop-dist/*
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: |
          case "${APPLE_TEMP_KEYCHAIN_PATH:-}" in
            "$RUNNER_TEMP"/*)
              security default-keychain -d user -s login.keychain-db || true
              security list-keychains -d user -s login.keychain-db || true
              security delete-keychain "$APPLE_TEMP_KEYCHAIN_PATH" || /bin/rm -f -- "$APPLE_TEMP_KEYCHAIN_PATH"
              ;;
            "") ;;
            *) echo "::error::Refusing to clean a keychain outside RUNNER_TEMP" >&2; exit 1 ;;
          esac
          for temporary_path in \
            "${APPLE_TEMP_CERTIFICATE_PATH:-}" \
            "${APPLE_API_KEY_PATH:-}" \
            "${TAURI_SIGNING_PRIVATE_KEY_PATH:-}" \
            "${TAURI_SIGNING_PRIVATE_KEY_PATH:-}.pub"
          do
            case "$temporary_path" in
              "$RUNNER_TEMP"/*) /bin/rm -f -- "$temporary_path" ;;
              ""|.pub) ;;
              *) echo "::error::Refusing to clean a file outside RUNNER_TEMP" >&2; exit 1 ;;
            esac
          done

  desktop-windows:
    needs: [release-target, release-mode, verify-main-full-ci, platform-gates]
    if: needs.release-mode.outputs.enabled == 'true'
    name: Desktop Windows (x86_64-pc-windows-msvc)
    runs-on: windows-2025
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-target.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2,x86_64-pc-windows-msvc
      - run: npm --prefix apps/desktop ci
      - name: Check formal Windows metadata
        env:
          RELEASE_TAG: ${{ needs.release-target.outputs.tag }}
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "发布标签 $RELEASE_TAG 与桌面版本 $version 不一致。" >&2
            exit 1
          fi
          node scripts/check-release-readiness.mjs --version "$version" --formal
          node scripts/check-windows-release-config.mjs
      - name: Import the Windows signing certificate after v2.0.0
        if: needs.release-target.outputs.tag != 'v2.0.0'
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { throw "WINDOWS_CERTIFICATE is required" }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "WINDOWS_CERTIFICATE_PASSWORD is required" }
          if (-not $env:WINDOWS_TIMESTAMP_URL) { throw "WINDOWS_TIMESTAMP_URL is required" }
          $certificatePath = Join-Path $env:RUNNER_TEMP "token-station-certificate.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "certificate import returned no thumbprint" }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build, audit, and stage the Windows MSI
        env:
          RELEASE_TAG: ${{ needs.release-target.outputs.tag }}
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" == "v2.0.0" ]]; then
            scripts/build-desktop.sh --production --unsigned-windows --target x86_64-pc-windows-msvc
            echo "The Windows MSI is not Authenticode-signed and can show an unknown publisher warning." >> "$GITHUB_STEP_SUMMARY"
          else
            scripts/build-desktop.sh --production --target x86_64-pc-windows-msvc
          fi
          version=$(node -p "require('./apps/desktop/package.json').version")
          mkdir desktop-dist
          cp apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi "desktop-dist/token-station_${version}_x86_64.msi"
          test "$(find desktop-dist -type f | wc -l | tr -d ' ')" = 1
      - uses: actions/upload-artifact@v4
        with:
          name: token-station-desktop-x86_64-pc-windows-msvc
          path: desktop-dist/*
          if-no-files-found: error

  publish:
    needs: [release-target, release-mode, verify-main-full-ci, platform-gates, linux-desktop, build, reproducibility, desktop-macos, desktop-windows]
    if: needs.release-mode.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-target.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the unsigned CLI manifest
        env:
          RELEASE_TAG: ${{ needs.release-target.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          cargo run --locked -p token-station-release --bin ts-release -- \
            manifest --version "$VERSION" --out dist/manifest.json \
            dist/token-station-cli-*.tar.gz
          node scripts/check-release-inputs.mjs --version "$VERSION" --dir dist
          cat dist/manifest.json
      - name: Create the draft for offline finalization
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-target.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag \
            --title "Token Station $RELEASE_TAG" \
            --notes "Draft. Awaiting offline CLI and updater signatures. Run the prepare, sign, and publish formal-release scripts." \
            dist/*.tar.gz dist/*.dmg dist/*.msi dist/*.deb dist/*.AppImage dist/*.rpm dist/manifest.json

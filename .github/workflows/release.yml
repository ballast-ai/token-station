# Formal binary release pipeline (C1#7). When explicitly enabled, a v* tag
# builds four platforms, proves reproducibility, and creates a draft release.
#
# This workflow never receives a signing private key. It produces an unsigned
# manifest.json; a maintainer signs it offline, uploads manifest.json.sig, and
# publishes the draft only after the complete release audit.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TOKEN_STATION_RELEASE_PUBKEY_HEX: ${{ vars.TOKEN_STATION_RELEASE_PUBKEY_HEX }}

jobs:
  release-mode:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.mode.outputs.enabled }}
    steps:
      - id: mode
        env:
          FORMAL_ARTIFACTS_ENABLED: ${{ vars.TOKEN_STATION_FORMAL_ARTIFACTS_ENABLED }}
        run: |
          if [[ "$FORMAL_ARTIFACTS_ENABLED" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "已启用正式 CLI 二进制构建。"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "本次只发布 GitHub 源码，跳过正式 CLI 二进制构建。"
          fi

  build:
    needs: release-mode
    if: needs.release-mode.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-apple-darwin, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag, version, and public release key
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/cli/Cargo.toml | head -1)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "发布标签 $GITHUB_REF_NAME 与 CLI 版本 $version 不一致。" >&2
            exit 1
          fi
          node scripts/check-release-readiness.mjs --version "$version" --formal
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # bsdtar lacks the ordering and timestamp controls required here.
      - if: runner.os == 'macOS'
        run: brew install gnu-tar
      - run: scripts/build-release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Rebuild the same recipe from clean trees and require byte identity.
  reproducibility:
    needs: release-mode
    if: needs.release-mode.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build twice from clean trees, compare bytes
        run: |
          scripts/build-release.sh x86_64-unknown-linux-gnu
          sha256sum dist/*.tar.gz | tee first.sum
          rm -rf dist target plugins/official/agent-openai/target plugins/official/agent-anthropic/target plugins/official/agent-openai-responses/target plugins/official/agent-gemini/target plugins/official/provider-openai-compatible/target
          scripts/build-release.sh x86_64-unknown-linux-gnu
          sha256sum -c first.sum

  publish:
    needs: [release-mode, build, reproducibility]
    if: needs.release-mode.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Manifest and checksums (unsigned here by design)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cargo run --locked -p token-station-release --bin ts-release -- \
            manifest --version "$VERSION" --out dist/manifest.json dist/*.tar.gz
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cat dist/manifest.json
      - name: Draft release (published only after the signature is attached)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "token-station-cli $GITHUB_REF_NAME" \
            --notes "Draft. Awaiting offline signature (manifest.json.sig) per docs/release/可复现构建与发布验证.md." \
            dist/*.tar.gz dist/manifest.json dist/SHA256SUMS

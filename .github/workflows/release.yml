# Formal binary release pipeline (C1#7). When explicitly enabled, a v* tag
# builds four CLI platforms and two macOS desktop targets, proves CLI
# reproducibility, and creates one draft release.
#
# The workflow receives Apple distribution credentials but no long-term release
# private key. Maintainers use the three formal-release scripts to transfer,
# sign, verify, and publish the draft.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TOKEN_STATION_RELEASE_PUBKEY_HEX: ${{ vars.TOKEN_STATION_RELEASE_PUBKEY_HEX }}
  TOKEN_STATION_UPDATER_PUBKEY: ${{ vars.TOKEN_STATION_UPDATER_PUBKEY }}

jobs:
  full-ci:
    uses: ./.github/workflows/full-ci.yml

  platform-gates:
    uses: ./.github/workflows/platform.yml

  linux-desktop:
    needs: [full-ci, platform-gates]
    uses: ./.github/workflows/linux-desktop.yml

  release-mode:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.mode.outputs.enabled }}
    steps:
      - id: mode
        env:
          FORMAL_ARTIFACTS_ENABLED: ${{ vars.TOKEN_STATION_FORMAL_ARTIFACTS_ENABLED }}
        run: |
          if [[ "$FORMAL_ARTIFACTS_ENABLED" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "已启用正式 CLI 二进制构建。"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "本次只发布 GitHub 源码，跳过正式 CLI 二进制构建。"
          fi

  build:
    needs: [release-mode, full-ci, platform-gates]
    if: needs.release-mode.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-apple-darwin, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag, version, and public release key
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/cli/Cargo.toml | head -1)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "发布标签 $GITHUB_REF_NAME 与 CLI 版本 $version 不一致。" >&2
            exit 1
          fi
          node scripts/check-release-readiness.mjs --version "$version" --formal
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # bsdtar lacks the ordering and timestamp controls required here.
      - if: runner.os == 'macOS'
        run: brew install gnu-tar
      - run: scripts/build-release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Rebuild the same recipe from clean trees and require byte identity.
  reproducibility:
    needs: [release-mode, full-ci, platform-gates]
    if: needs.release-mode.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build twice from clean trees, compare bytes
        run: |
          scripts/build-release.sh x86_64-unknown-linux-gnu
          sha256sum dist/*.tar.gz | tee first.sum
          rm -rf dist target plugins/official/agent-openai/target plugins/official/agent-anthropic/target plugins/official/agent-openai-responses/target plugins/official/agent-gemini/target plugins/official/provider-openai-compatible-v2/target plugins/official/provider-anthropic-v2/target
          scripts/build-release.sh x86_64-unknown-linux-gnu
          sha256sum -c first.sum

  desktop-macos:
    needs: [release-mode, full-ci, platform-gates]
    if: needs.release-mode.outputs.enabled == 'true'
    name: Desktop macOS (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2,${{ matrix.target }}
      - run: npm --prefix apps/desktop ci
      - name: Check formal desktop metadata and DMG policy
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "发布标签 $GITHUB_REF_NAME 与桌面版本 $version 不一致。" >&2
            exit 1
          fi
          node scripts/check-release-readiness.mjs --version "$version" --formal
          node scripts/check-macos-dmg-packaging.mjs
          test -n "$TOKEN_STATION_UPDATER_PUBKEY"
      - name: Generate an untrusted temporary updater bundler key
        run: |
          key_path="$RUNNER_TEMP/token-station-updater-ci.key"
          npx --prefix apps/desktop tauri signer generate --ci --force \
            --password temporary-ci-only --write-keys "$key_path" >/dev/null
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=temporary-ci-only" >> "$GITHUB_ENV"
      - name: Require Apple signing and notarization secrets
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_KEYCHAIN_PASSWORD"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_CONTENT"
      - name: Import Developer ID certificate
        run: |
          certificate="$RUNNER_TEMP/token-station-certificate.p12"
          keychain="$RUNNER_TEMP/token-station-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
      - name: Prepare App Store Connect key
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and audit
        run: scripts/build-desktop.sh --production --target "${{ matrix.target }}"
      - name: Stage flat desktop release inputs
        run: |
          mkdir desktop-dist
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg desktop-dist/
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz desktop-dist/
          test "$(find desktop-dist -type f | wc -l | tr -d ' ')" = 2
      - uses: actions/upload-artifact@v4
        with:
          name: token-station-desktop-${{ matrix.target }}
          path: desktop-dist/*
          if-no-files-found: error

  publish:
    needs: [release-mode, full-ci, platform-gates, linux-desktop, build, reproducibility, desktop-macos]
    if: needs.release-mode.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the unsigned CLI manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cargo run --locked -p token-station-release --bin ts-release -- \
            manifest --version "$VERSION" --out dist/manifest.json \
            dist/token-station-cli-*.tar.gz
          node scripts/check-release-inputs.mjs --version "$VERSION" --dir dist
          cat dist/manifest.json
      - name: Create the draft for offline finalization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Token Station $GITHUB_REF_NAME" \
            --notes "Draft. Awaiting offline CLI and updater signatures. Run the prepare, sign, and publish formal-release scripts." \
            dist/*.tar.gz dist/*.dmg dist/manifest.json

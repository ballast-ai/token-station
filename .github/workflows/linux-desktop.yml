name: Build Linux Desktop

# Linux desktop packages (deb, AppImage, and rpm) are unsigned, so they require no secrets.
# Select Run workflow manually. Download the output from Artifacts for that run.
# Also run automatically when a v* tag is pushed to produce Linux release packages.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    name: Linux (x86_64-unknown-linux-gnu)
    # Ubuntu 22.04 has older glibc and WebKit. Its packages run on more distributions through forward compatibility.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libssl-dev \
            libxdo-dev \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32-wasip2 for the bundled plugin adapters; the linux target for
          # the desktop binary itself.
          targets: wasm32-wasip2,x86_64-unknown-linux-gnu

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/desktop/src-tauri/target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - run: npm --prefix apps/desktop ci

      # --local: no code signing (Linux packages are not signed like mac/win).
      # This builds the WASM plugins, runs the bundled-plugins load test, builds
      # deb/AppImage/rpm via tauri, and runs the Linux artifact audit.
      - name: Build and audit Linux desktop packages
        run: scripts/build-desktop.sh --local

      - uses: actions/upload-artifact@v4
        with:
          name: token-station-desktop-linux-x86_64
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

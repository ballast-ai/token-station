name: Build Linux Desktop

# Linux desktop packages are unsigned and are only produced when the formal
# artifact gate is explicitly enabled. Successful packages remain internal
# workflow artifacts and are not attached to a GitHub Release automatically.
on:
  workflow_call:
    inputs:
      mode:
        description: "Passed down by the calling release workflow."
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      mode:
        description: "formal builds and publishes; source-only deliberately skips artifacts"
        type: choice
        required: true
        options: [source-only, formal]

permissions:
  contents: read

jobs:
  # Fails closed rather than skipping silently: see scripts/resolve-release-mode.mjs.
  release-mode:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.mode.outputs.formal }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
      - id: mode
        env:
          TS_EVENT: ${{ github.event_name }}
          TS_REF: ${{ github.ref }}
          TS_REQUESTED_MODE: ${{ inputs.mode }}
          TS_REQUIRED: >-
            TOKEN_STATION_FORMAL_ARTIFACTS_ENABLED
          # Presence only. A secret's value never reaches the process.
          TS_HAS_TOKEN_STATION_FORMAL_ARTIFACTS_ENABLED: ${{ vars.TOKEN_STATION_FORMAL_ARTIFACTS_ENABLED == 'true' }}
        run: node scripts/resolve-release-mode.mjs

  linux:
    needs: release-mode
    if: needs.release-mode.outputs.enabled == 'true'
    name: Linux (x86_64-unknown-linux-gnu)
    # Ubuntu 22.04 keeps glibc and WebKit compatibility broad.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libssl-dev \
            libxdo-dev \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32-wasip2 for the bundled plugin adapters; the linux target for
          # the desktop binary itself.
          targets: wasm32-wasip2,x86_64-unknown-linux-gnu

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/desktop/src-tauri/target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - run: npm --prefix apps/desktop ci

      # --local: no code signing (Linux packages are not signed like mac/win).
      # This builds the WASM plugins, runs the bundled-plugins load test, builds
      # deb/AppImage/rpm via tauri, and runs the Linux artifact audit.
      - name: Build and audit Linux desktop packages
        run: scripts/build-desktop.sh --local

      - uses: actions/upload-artifact@v4
        with:
          name: token-station-desktop-linux-x86_64
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

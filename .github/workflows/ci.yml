name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# A new push to the same PR makes every result from the older commit obsolete.
# Cancel it immediately instead of letting several full Rust builds compete for
# hosted-runner time and cache bandwidth.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Use the gh CLI to determine whether changes affect the desktop app or installer.
  # Do not check out code or add third-party actions. This repository limits supply-chain dependencies.
  # Set true for all non-pull_request events. The windows-msi event condition decides whether it runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate -f per_page=100 --jq '.[].filename' > changed-files.txt
          if grep -qE '^(apps/desktop/|scripts/(build-desktop\.sh|test-windows-msi\.ps1|check-windows-release-config\.mjs)$)' changed-files.txt; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
          else
            echo "installer=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The keyring Linux backend, secret-service, uses D-Bus and needs headers at build time.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # plugin-runtime tests compile tests/guests/* into real WASM components.
          targets: wasm32-wasip2
      # A full wasmtime, tokio, and sqlite rebuild takes about seven minutes. The cache removes most of it. Five WASM
      # The guest is an independent crate excluded from the workspace. Tests build it in a subprocess with a separate target.
      # Each item must be listed to use the cache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
            crates/plugin-runtime/tests/guests/test-provider
      - name: Fetch the locked scaffold dependency set
        run: >-
          cargo fetch --locked --target wasm32-wasip2
          --manifest-path plugins/official/provider-openai-compatible/Cargo.toml
      - run: scripts/check-rust-format.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The local gate always runs doc -D warnings. Without it in CI, the rule is only a convention.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Allowed licenses, RustSec advisories, and dependency sources. Configuration is in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # This overlaps the deny advisories but runs separately. audit reads only Cargo.lock and does not need
  # build graph. It still enforces the rule when deny graph construction fails. The two failure signals are also clearer.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  desktop-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Tauri Linux system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: |
            apps/desktop/src-tauri
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
      - name: Prepare official plugins for desktop gateway tests
        run: scripts/prepare-desktop-test-plugins.sh
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo doc --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Rust 1.95 minimum-version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          key: msrv-1.95
      - run: cargo check --workspace --all-targets

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/desktop run test:coverage
      - run: npm --prefix apps/desktop run build

  rust-coverage:
    # The PR already runs the complete Rust test suite in `rust`. Coverage
    # instruments and repeats that suite, so keep it as a post-merge/manual
    # quality gate instead of doubling every PR's slowest workload.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
            crates/plugin-runtime/tests/guests/test-provider
      - run: >-
          cargo llvm-cov --workspace --coverage-host-only --summary-only
          --fail-under-lines 80

  desktop-coverage:
    # `desktop-rust` remains the PR gate. Full line coverage still runs on main
    # and from workflow_dispatch without delaying every review iteration.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Tauri Linux system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: |
            apps/desktop/src-tauri
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
      - name: Prepare official plugins for desktop gateway tests
        run: scripts/prepare-desktop-test-plugins.sh
      - run: >-
          cargo llvm-cov --manifest-path apps/desktop/src-tauri/Cargo.toml
          --lcov --output-path apps/desktop/src-tauri/target/desktop-agent.lcov
      - name: Enforce desktop Rust line coverage
        run: >-
          node scripts/check-coverage-thresholds.mjs
          apps/desktop/src-tauri/target/desktop-agent.lcov
          apps/desktop/src-tauri/src 90
      - run: >-
          node scripts/check-coverage-thresholds.mjs
          apps/desktop/src-tauri/target/desktop-agent.lcov
          apps/desktop/src-tauri/src/agent_integration 90

  agent-platform-targeted:
    name: Agent platform checks (${{ matrix.os }})
    # macOS costs 10 times more, and Windows costs 2 times more. Platform-specific regressions appear later on the integration branch.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: runner.os == 'Windows'
        name: Exclude the workspace from Defender real-time scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: apps/desktop/src-tauri
      # Run only repository fixtures and in-memory key or key-decoding boundaries. Never install or upgrade an Agent.
      - run: >-
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          discovery_platform_templates_expand_without_touching_the_filesystem
      - run: >-
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          discovery_windows_path_enumerates_native_files_and_reports_shell_shims
      - run: >-
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          snapshot_validation_rejects_malformed_index_envelope_and_hex
      # Windows ACL application happens before the atomic rename.  This
      # regression test injects its Permission failure at that boundary and
      # proves the pre-existing agent config remains intact.
      - if: runner.os == 'Windows'
        run: >-
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          transaction_snapshot_and_pre_replace_failures_leave_target_untouched

  windows-rust:
    name: Windows full Rust and desktop gates
    # On PRs, the Linux rust job runs the same clippy and tests. Windows costs twice as much.
    # Do not rerun the full suite on the PR. Run the complete cross-platform gate after merge to develop.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Defender real-time scanning inspects many small files from Rust incremental compilation.
      # Excluding the workspace usually makes builds 20–40% faster.
      - name: Exclude the workspace from Defender real-time scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            apps/desktop/src-tauri
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
      - run: npm --prefix apps/desktop ci
      - run: node scripts/check-windows-release-config.mjs
      - name: Fetch the locked scaffold dependency set
        run: >-
          cargo fetch --locked --target wasm32-wasip2
          --manifest-path plugins/official/provider-openai-compatible/Cargo.toml
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Prepare official plugins for desktop gateway tests
        shell: bash
        run: scripts/prepare-desktop-test-plugins.sh
      - run: >-
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml
          --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  windows-msi:
    name: Windows x64 MSI real lifecycle
    needs: [changes, windows-rust]
    # Installer lifecycle validation: build the release desktop application twice, about 41 minutes times two.
    # A merge to main means the code is ready for release, so run it there. Do not run it for routine develop merges.
    # PRs that change desktop or installer paths are still blocked.
    if: >-
      !cancelled() &&
      needs.changes.outputs.installer == 'true' &&
      (github.ref == 'refs/heads/main' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Defender real-time scanning inspects many small files from Rust incremental compilation.
      # Excluding the workspace usually makes builds 20–40% faster.
      - name: Exclude the workspace from Defender real-time scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2,x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: |
            apps/desktop/src-tauri
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
      - run: npm --prefix apps/desktop ci
      - run: node scripts/check-windows-release-config.mjs
      - name: Build older MSI
        shell: bash
        run: >-
          scripts/build-desktop.sh --local
          --target x86_64-pc-windows-msvc --test-version 250.1.0
      - name: Preserve older MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $msi) { throw "older MSI was not produced" }
          Copy-Item -LiteralPath $msi.FullName -Destination "$env:RUNNER_TEMP\token-station-older.msi"
      - name: Build newer MSI
        shell: bash
        run: >-
          scripts/build-desktop.sh --local
          --target x86_64-pc-windows-msvc --test-version 250.2.0
      - name: Preserve newer MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $msi) { throw "newer MSI was not produced" }
          Copy-Item -LiteralPath $msi.FullName -Destination "$env:RUNNER_TEMP\token-station-newer.msi"
      - name: Install, start, upgrade, block downgrade, and uninstall
        shell: pwsh
        run: |
          scripts/test-windows-msi.ps1 `
            -OlderMsi "$env:RUNNER_TEMP\token-station-older.msi" `
            -NewerMsi "$env:RUNNER_TEMP\token-station-newer.msi" `
            -LogDirectory "$env:RUNNER_TEMP\token-station-msi-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: token-station-windows-msi-lifecycle-logs
          path: |
            ${{ runner.temp }}/token-station-msi-logs/*.log
            ${{ runner.temp }}/token-station-msi-logs/*-self-test.json
          if-no-files-found: warn

  desktop-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: node scripts/check-rustsec-exceptions.mjs
      - run: >-
          cargo audit -D unsound
          --file apps/desktop/src-tauri/Cargo.lock
          --ignore RUSTSEC-2024-0429
      - run: >-
          cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml
          --config apps/desktop/src-tauri/deny.toml check

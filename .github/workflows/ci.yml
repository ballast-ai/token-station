name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  release:
    types:
      - published
  workflow_dispatch:

# A new push to the same PR makes every result from the older commit obsolete.
# Cancel it immediately instead of letting several full Rust builds compete for
# hosted-runner time and cache bandwidth.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 判定本次变更是否触及桌面端或安装器。用 gh CLI 查 PR 变更文件，
  # 不 checkout、不引入第三方 action——本仓对供应链依赖谨慎。
  # 非 pull_request 事件一律置 true，由 windows-msi 自身的事件条件决定是否跑。
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --paginate --jq '.[].filename' > changed-files.txt
          if grep -qE '^(apps/desktop/|scripts/(build-desktop\.sh|test-windows-msi\.ps1|check-windows-release-config\.mjs)$)' changed-files.txt; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
          else
            echo "installer=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # keyring 的 Linux 后端（secret-service）经 D-Bus，构建期要头文件
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # plugin-runtime 的测试把 tests/guests/* 编成真实的 WASM 组件
          targets: wasm32-wasip2
      # wasmtime+tokio+sqlite 全量重编 ~7 分钟；缓存能砍掉大半。五个 WASM
      # guest 是 workspace 排除的独立 crate（测试子进程构建、各有 target），
      # 得逐个列进来才吃得到缓存。
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
            crates/plugin-runtime/tests/guests/test-provider
      - name: Fetch the locked scaffold dependency set
        run: >-
          cargo fetch --locked --target wasm32-wasip2
          --manifest-path plugins/official/provider-openai-compatible/Cargo.toml
      - run: scripts/check-rust-format.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # 本地门禁一直在跑 doc -D warnings，CI 缺了它就只是个约定。
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # license 允许清单、RustSec 通告、依赖来源。配置在 deny.toml。
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # 与 deny 的 advisories 有重叠，仍然分开跑：audit 只读 Cargo.lock，不需要
  # 构建图，deny 的图构建坏掉时它仍在把关；两者的失败信号也各自更可读。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  desktop-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Tauri Linux system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: |
            apps/desktop/src-tauri
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
      - name: Prepare official plugins for desktop gateway tests
        run: scripts/prepare-desktop-test-plugins.sh
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo doc --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Rust 1.95 minimum-version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          key: msrv-1.95
      - run: cargo check --workspace --all-targets

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/desktop run test:coverage
      - run: npm --prefix apps/desktop run build

  rust-coverage:
    # The PR already runs the complete Rust test suite in `rust`. Coverage
    # instruments and repeats that suite, so keep it as a post-merge/manual
    # quality gate instead of doubling every PR's slowest workload.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
            crates/plugin-runtime/tests/guests/test-provider
      - run: >-
          cargo llvm-cov --workspace --coverage-host-only --summary-only
          --fail-under-lines 80

  desktop-coverage:
    # Keep the full Desktop Rust and Agent Integration coverage gates pre-merge.
    # Branch pushes repeat the same check against the exact committed revision.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Tauri Linux system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: |
            apps/desktop/src-tauri
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
      - name: Prepare official plugins for desktop gateway tests
        run: scripts/prepare-desktop-test-plugins.sh
      - run: >-
          cargo llvm-cov --manifest-path apps/desktop/src-tauri/Cargo.toml
          --lcov --output-path apps/desktop/src-tauri/target/desktop-agent.lcov
      - name: Enforce desktop Rust line coverage
        # The cross-platform command layer contains cfg-gated macOS/Windows paths
        # that a Linux-only coverage job cannot execute. Ratchet the complete tree
        # at its verified baseline while keeping the security-sensitive Agent
        # integration module on the stricter 90% gate below.
        run: >-
          node scripts/check-coverage-thresholds.mjs
          apps/desktop/src-tauri/target/desktop-agent.lcov
          apps/desktop/src-tauri/src 86.3
      - run: >-
          node scripts/check-coverage-thresholds.mjs
          apps/desktop/src-tauri/target/desktop-agent.lcov
          apps/desktop/src-tauri/src/agent_integration 90

  # 这个 job 只做一件 Linux 做不到的事：在 macOS 宿主上编译桌面端，
  # 让 #[cfg(target_os = "macos")] 的代码（如 verified_workbuddy_bundle，
  # 它要调 /usr/bin/codesign）得到类型检查。
  #
  # 它此前是 macOS+Windows 矩阵，跑四个指定测试。那四个测试经核查全部与
  # 宿主平台无关——平台是以 Platform::Macos/Windows 枚举作参数传入的，
  # transaction 那个用 FailBeforeReplaceWriter 注入 AtomicWriteStage::Permission
  # 来模拟时序、并不触碰真实 DACL——且四个都是裸 #[test] 无 cfg 守卫，
  # 早已由 1x 倍率的 desktop-rust 全量 cargo test 覆盖。以 10x/2x 的价格重跑
  # 一遍不产生任何额外覆盖。Windows 一侧另有 windows-rust 跑全量 cargo test，
  # 其中包含全仓唯一带 #[cfg(windows)] 守卫的测试
  # （ownership_store_hardens_a_legacy_regular_index_before_reading），
  # 那才是真正只能在 Windows 上跑的东西——它反而不在旧的指定测试清单里。
  macos-compile-check:
    name: macOS compile check
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: apps/desktop/src-tauri
      # --all-targets 让测试代码也参与编译，这样 macOS 专属的测试代码
      # 一旦写坏也能在这里被发现，而不必等发版打 tag。
      - run: >-
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
          --all-targets

  windows-rust:
    name: Windows full Rust and desktop gates
    # PR 阶段由 Linux 的 rust job 覆盖同一套 clippy/test；Windows 是 2x 倍率，
    # 全量重跑一遍不值。合并进 develop 后再跑完整的跨平台门禁。
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Defender 实时扫描会逐个扫 Rust 增量编译产生的大量小文件，
      # 排除工作区后构建通常快 20-40%。
      - name: Exclude the workspace from Defender real-time scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            apps/desktop/src-tauri
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
      - run: npm --prefix apps/desktop ci
      - run: node scripts/check-windows-release-config.mjs
      - name: Fetch the locked scaffold dependency set
        run: >-
          cargo fetch --locked --target wasm32-wasip2
          --manifest-path plugins/official/provider-openai-compatible/Cargo.toml
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Prepare official plugins for desktop gateway tests
        shell: bash
        run: scripts/prepare-desktop-test-plugins.sh
      - run: >-
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml
          --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  windows-msi:
    name: Windows x64 MSI real lifecycle
    needs: [changes, windows-rust]
    # This release-grade gate builds two installers and exercises the complete
    # lifecycle. Run it for published releases and manual release validation,
    # not for routine pushes or pull requests. Regular CI still covers behavior.
    if: >-
      !cancelled() &&
      needs.changes.outputs.installer == 'true' &&
      (github.event_name == 'release' ||
       github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Defender 实时扫描会逐个扫 Rust 增量编译产生的大量小文件，
      # 排除工作区后构建通常快 20-40%。
      - name: Exclude the workspace from Defender real-time scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2,x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: |
            apps/desktop/src-tauri
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
      - run: npm --prefix apps/desktop ci
      - run: node scripts/check-windows-release-config.mjs
      - name: Build older MSI
        shell: bash
        run: >-
          scripts/build-desktop.sh --local
          --target x86_64-pc-windows-msvc --test-version 250.1.0
      - name: Preserve older MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $msi) { throw "older MSI was not produced" }
          Copy-Item -LiteralPath $msi.FullName -Destination "$env:RUNNER_TEMP\token-station-older.msi"
      - name: Build newer MSI
        shell: bash
        run: >-
          scripts/build-desktop.sh --local
          --target x86_64-pc-windows-msvc --test-version 250.2.0
      - name: Preserve newer MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $msi) { throw "newer MSI was not produced" }
          Copy-Item -LiteralPath $msi.FullName -Destination "$env:RUNNER_TEMP\token-station-newer.msi"
      - name: Install, start, upgrade, block downgrade, and uninstall
        shell: pwsh
        run: |
          scripts/test-windows-msi.ps1 `
            -OlderMsi "$env:RUNNER_TEMP\token-station-older.msi" `
            -NewerMsi "$env:RUNNER_TEMP\token-station-newer.msi" `
            -LogDirectory "$env:RUNNER_TEMP\token-station-msi-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: token-station-windows-msi-lifecycle-logs
          path: |
            ${{ runner.temp }}/token-station-msi-logs/*.log
            ${{ runner.temp }}/token-station-msi-logs/*-self-test.json
          if-no-files-found: warn

  desktop-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: node scripts/check-rustsec-exceptions.mjs
      - run: >-
          cargo audit -D unsound
          --file apps/desktop/src-tauri/Cargo.lock
          --ignore RUSTSEC-2024-0429
      - run: tests/build-desktop-verbosity.sh
      - run: tests/desktop-updater-release.sh
      - run: >-
          cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml
          --config apps/desktop/src-tauri/deny.toml check

name: CI

# Fast feedback for day-to-day work: format, lint, and tests only. Coverage
# thresholds, supply-chain audits, release-policy gates, and the MSRV check run
# on main via full-ci.yml; platform validation runs before a release build.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          workspaces: |
            .
            plugins/official/provider-openai-compatible-v2
            plugins/official/provider-anthropic-v2
      - name: Prepare official plugins for gateway tests
        run: scripts/prepare-desktop-test-plugins.sh
      - name: Fetch the locked official component dependency sets
        shell: bash
        run: |
          for manifest in \
            plugins/official/provider-openai-compatible-v2/Cargo.toml \
            plugins/official/provider-anthropic-v2/Cargo.toml; do
            cargo fetch --locked --target wasm32-wasip2 --manifest-path "$manifest"
          done
      - run: scripts/check-rust-format.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Test builtin official South paths
        run: >-
          cargo test -p token-station-cli --features builtin-plugins
          --lib --test proxy
        env:
          TOKEN_STATION_PLUGINS_DIST: ${{ github.workspace }}/plugins-dist

  desktop-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          workspaces: apps/desktop/src-tauri
          system-deps: tauri
      - name: Prepare official plugins for desktop gateway tests
        run: scripts/prepare-desktop-test-plugins.sh
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm --prefix apps/desktop ci
      - run: node tests/agent-sensitive-boundary.mjs
      - run: npm --prefix apps/desktop test -- --run
      - run: npm --prefix apps/desktop run build

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A new push to the same PR makes every result from the older commit obsolete.
# Cancel it immediately instead of letting several full Rust builds compete for
# hosted-runner time and cache bandwidth.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The keyring Linux backend, secret-service, uses D-Bus and needs headers at build time.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # plugin-runtime tests compile tests/guests/* into real WASM components.
          targets: wasm32-wasip2
      # A full wasmtime, tokio, and sqlite rebuild takes about seven minutes. The cache removes most of it. Five WASM
      # The guest is an independent crate excluded from the workspace. Tests build it in a subprocess with a separate target.
      # Each item must be listed to use the cache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
            crates/plugin-runtime/tests/guests/test-provider
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The local gate always runs doc -D warnings. Without it in CI, the rule is only a convention.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Allowed licenses, RustSec advisories, and dependency sources. Configuration is in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # This overlaps the deny advisories but runs separately. audit reads only Cargo.lock and does not need
  # build graph. It still enforces the rule when deny graph construction fails. The two failure signals are also clearer.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  desktop-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Tauri Linux system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            apps/desktop/src-tauri
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
      - name: Prepare official plugins for desktop gateway tests
        run: scripts/prepare-desktop-test-plugins.sh
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo doc --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/desktop run test:coverage
      - run: npm --prefix apps/desktop run build

  rust-coverage:
    # The PR already runs the complete Rust test suite in `rust`. Coverage
    # instruments and repeats that suite, so keep it as a post-merge/manual
    # quality gate instead of doubling every PR's slowest workload.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
            crates/plugin-runtime/tests/guests/test-provider
      - run: >-
          cargo llvm-cov --workspace --coverage-host-only --summary-only
          --fail-under-lines 80

  desktop-coverage:
    # `desktop-rust` remains the PR gate. Full line coverage still runs on main
    # and from workflow_dispatch without delaying every review iteration.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Tauri Linux system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            apps/desktop/src-tauri
            plugins/official/agent-anthropic
            plugins/official/agent-openai
            plugins/official/agent-openai-responses
            plugins/official/agent-gemini
            plugins/official/provider-openai-compatible
      - name: Prepare official plugins for desktop gateway tests
        run: scripts/prepare-desktop-test-plugins.sh
      - run: >-
          cargo llvm-cov --manifest-path apps/desktop/src-tauri/Cargo.toml
          --lcov --output-path apps/desktop/src-tauri/target/desktop-agent.lcov
      - name: Enforce desktop Rust line coverage
        run: >-
          node scripts/check-coverage-thresholds.mjs
          apps/desktop/src-tauri/target/desktop-agent.lcov
          apps/desktop/src-tauri/src 90
      - run: >-
          node scripts/check-coverage-thresholds.mjs
          apps/desktop/src-tauri/target/desktop-agent.lcov
          apps/desktop/src-tauri/src/agent_integration 90

  agent-platform-targeted:
    name: Agent platform checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: apps/desktop/src-tauri
      # Run only repository fixtures and in-memory key or key-decoding boundaries. Never install or upgrade an Agent.
      - run: >-
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          discovery_platform_templates_expand_without_touching_the_filesystem
      - run: >-
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          discovery_windows_path_enumerates_native_files_and_reports_shell_shims
      - run: >-
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          snapshot_validation_rejects_malformed_index_envelope_and_hex
      # Windows ACL application happens before the atomic rename.  This
      # regression test injects its Permission failure at that boundary and
      # proves the pre-existing agent config remains intact.
      - if: runner.os == 'Windows'
        run: >-
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          transaction_snapshot_and_pre_replace_failures_leave_target_untouched

  desktop-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: node scripts/check-rustsec-exceptions.mjs
      - run: >-
          cargo audit -D unsound
          --file apps/desktop/src-tauri/Cargo.lock
          --ignore RUSTSEC-2024-0429
      - run: >-
          cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml
          --config apps/desktop/src-tauri/deny.toml check

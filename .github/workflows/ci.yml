name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # keyring 的 Linux 后端（secret-service）经 D-Bus，构建期要头文件
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # plugin-runtime 的测试把 tests/guests/* 编成真实的 WASM 组件
          targets: wasm32-wasip2
      # wasmtime+tokio+sqlite 全量重编 ~7 分钟；缓存能砍掉大半。三个 WASM
      # guest 是 workspace 排除的独立 crate（测试子进程构建、各有 target），
      # 得逐个列进来才吃得到缓存。
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            plugins/official/agent-openai
            plugins/official/provider-openai-compatible
            crates/plugin-runtime/tests/guests/test-provider
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # 本地门禁一直在跑 doc -D warnings，CI 缺了它就只是个约定。
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # license 允许清单、RustSec 通告、依赖来源。配置在 deny.toml。
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # 与 deny 的 advisories 有重叠，仍然分开跑：audit 只读 Cargo.lock，不需要
  # 构建图，deny 的图构建坏掉时它仍在把关；两者的失败信号也各自更可读。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

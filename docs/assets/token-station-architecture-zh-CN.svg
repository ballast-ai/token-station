<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-label="Token Station 的工作方式">
  <style>
    .text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;text-anchor:middle}
    .headline{font-size:34px;font-weight:600;fill:#24292F}
    .card-title{font-size:30px;font-weight:600;fill:#24292F}
    .body{font-size:18px;font-weight:400;fill:#57606A}
    .agent-name{font-size:22px;font-weight:500;fill:#3D444D}
    .center-title{font-size:40px;font-weight:600;fill:#24292F}
    .center-subtitle{font-size:22px;font-weight:500;fill:#6E6258}
    .value{font-size:24px;font-weight:500;fill:#24292F}
    .pill-text{font-size:16px;font-weight:500;fill:#3D444D}
    .destination{font-size:22px;font-weight:500;fill:#24292F}
    .destination-note{font-size:18px;font-weight:400;fill:#57606A}
  </style>

  <rect width="1440" height="720" fill="#FAF9F7"/>

  <text class="text headline" x="720" y="84">一个本地入口，自动选择合适的模型</text>

  <!-- Three independent product cards. -->
  <rect x="60" y="190" width="320" height="380" rx="32" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2"/>
  <rect x="470" y="190" width="500" height="380" rx="36" fill="#F3EFE8" stroke="#C7BFB4" stroke-width="2"/>
  <rect x="1060" y="190" width="320" height="380" rx="32" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2"/>

  <!-- Two simple directional cues; no topology lines. -->
  <circle cx="425" cy="380" r="30" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2"/>
  <path d="M417 368 L429 380 L417 392" fill="none" stroke="#B65F2A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1015" cy="380" r="30" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2"/>
  <path d="M1007 368 L1019 380 L1007 392" fill="none" stroke="#B65F2A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Input card. -->
  <text class="text card-title" x="220" y="290">支持的 AI 助手</text>
  <line x1="110" y1="326" x2="330" y2="326" stroke="#E5E1DA" stroke-width="2"/>
  <text class="text agent-name" x="220" y="378">Claude Code</text>
  <text class="text agent-name" x="220" y="423">Codex</text>
  <text class="text agent-name" x="220" y="468">WorkBuddy</text>

  <!-- Token Station value card. -->
  <text class="text center-title" x="720" y="257">Token Station</text>
  <text class="text center-subtitle" x="720" y="295">本地智能路由</text>
  <line x1="525" y1="322" x2="915" y2="322" stroke="#D8D2C8" stroke-width="2"/>
  <text class="text value" x="720" y="371">按任务需求</text>
  <text class="text value" x="720" y="402">匹配模型</text>
  <text class="text value" x="720" y="449">重置前优先使用</text>
  <text class="text value" x="720" y="480">剩余额度</text>
  <rect x="495" y="516" width="230" height="38" rx="12" fill="#E7E1D8"/>
  <text class="text pill-text" x="610" y="541">Rust 高性能内核</text>
  <rect x="735" y="516" width="210" height="38" rx="12" fill="#E7E1D8"/>
  <text class="text pill-text" x="840" y="541">沙箱化 WASM 插件</text>

  <!-- Destination card. -->
  <text class="text card-title" x="1220" y="290">可用模型</text>
  <line x1="1110" y1="326" x2="1330" y2="326" stroke="#E5E1DA" stroke-width="2"/>
  <text class="text destination" x="1220" y="376">云端模型</text>
  <text class="text destination-note" x="1220" y="405">使用自己的 API 密钥</text>
  <text class="text destination" x="1220" y="452">本地模型</text>
  <text class="text destination-note" x="1220" y="481">通过 Ollama 运行</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-label="Token Station 的手机端工作方式">
  <style>
    .text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;text-anchor:middle}
    .headline{font-size:34px;font-weight:600;fill:#24292F}
    .card-title{font-size:32px;font-weight:600;fill:#24292F}
    .body{font-size:22px;font-weight:400;fill:#57606A}
    .agent-name{font-size:20px;font-weight:500;fill:#3D444D}
    .center-title{font-size:34px;font-weight:600;fill:#24292F}
    .center-subtitle{font-size:22px;font-weight:500;fill:#6E6258}
    .value{font-size:26px;font-weight:500;fill:#24292F}
    .pill-text{font-size:18px;font-weight:500;fill:#3D444D}
    .destination{font-size:22px;font-weight:500;fill:#24292F}
    .destination-note{font-size:18px;font-weight:400;fill:#57606A}
  </style>

  <rect width="720" height="900" fill="#FAF9F7"/>

  <text class="text headline" x="360" y="45">一个本地入口，</text>
  <text class="text headline" x="360" y="82">自动选择合适的模型</text>

  <!-- Three independent cards in one vertical product story. -->
  <rect x="70" y="120" width="580" height="150" rx="28" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2"/>
  <rect x="70" y="335" width="580" height="260" rx="32" fill="#F3EFE8" stroke="#C7BFB4" stroke-width="2"/>
  <rect x="70" y="650" width="580" height="200" rx="28" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2"/>

  <!-- Two simple downward directional cues; no topology lines. -->
  <circle cx="360" cy="302" r="22" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2"/>
  <path d="M348 296 L360 308 L372 296" fill="none" stroke="#B65F2A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="360" cy="628" r="22" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2"/>
  <path d="M348 622 L360 634 L372 622" fill="none" stroke="#B65F2A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Input card. -->
  <text class="text card-title" x="360" y="168">支持的 AI 助手</text>
  <line x1="130" y1="190" x2="590" y2="190" stroke="#E5E1DA" stroke-width="2"/>
  <text class="text agent-name" x="360" y="210">Claude Code</text>
  <text class="text agent-name" x="360" y="234">Codex</text>
  <text class="text agent-name" x="360" y="258">WorkBuddy</text>

  <!-- Token Station value card. -->
  <text class="text center-title" x="360" y="382">Token Station</text>
  <text class="text center-subtitle" x="360" y="416">本地智能路由</text>
  <line x1="130" y1="438" x2="590" y2="438" stroke="#D8D2C8" stroke-width="2"/>
  <text class="text value" x="360" y="480">按任务需求匹配模型</text>
  <text class="text value" x="360" y="526">重置前优先使用剩余额度</text>
  <rect x="95" y="548" width="250" height="34" rx="10" fill="#E7E1D8"/>
  <text class="text pill-text" x="220" y="572">Rust 高性能内核</text>
  <rect x="355" y="548" width="270" height="34" rx="10" fill="#E7E1D8"/>
  <text class="text pill-text" x="490" y="572">沙箱化 WASM 插件</text>

  <!-- Destination card. -->
  <text class="text card-title" x="360" y="695">可用模型</text>
  <line x1="130" y1="720" x2="590" y2="720" stroke="#E5E1DA" stroke-width="2"/>
  <text class="text destination" x="360" y="752">云端模型</text>
  <text class="text destination-note" x="360" y="778">使用自己的 API 密钥</text>
  <text class="text destination" x="360" y="812">本地模型</text>
  <text class="text destination-note" x="360" y="838">通过 Ollama 运行</text>
</svg>

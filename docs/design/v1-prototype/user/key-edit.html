<!DOCTYPE html>
<!--
  路由: GET /dashboard/keys/{id}/edit
  还原依据: src/templates/user_pages.rs edit_key_page()
  · 实际字段只有两组: 密钥名称 + WASM 中间件（当前模块/移除勾选/预设下拉/自定义上传区）
  · V1 用户侧密钥编辑页没有模型白名单——模型可见性由团队/管理端管控
  · WASM 预设选项来自 config.example.toml [[wasm_presets]]（Complexity Router / Echo Redirect）
  · 「上传你自己的…」选中后展开 #custom-upload（源码行为,已保留同款内联 JS）
-->
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑密钥 · Token Station</title>
  <script>
  (function(){
    try {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
  </script>
  <link rel="stylesheet" href="../assets/dash.css">
  <style>
  /* lang_toggle 样式,照搬 layout.rs */
  .lang-inline{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line,#e2e8f0);border-radius:6px;padding:2px;vertical-align:middle;}
  .lang-inline .lang-opt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:24px;padding:0 5px;font-size:12px;font-weight:600;color:var(--text-2,#64748b);text-decoration:none;border-radius:4px;line-height:1;}
  .lang-inline .lang-opt:hover{color:var(--text-0,#0f172a);}
  .lang-inline .lang-opt.active{background:var(--bg-2,#f1f5f9);color:var(--text-0,#0f172a);}
  html[data-theme="dark"] .lang-inline{border-color:#334155;}
  html[data-theme="dark"] .lang-inline .lang-opt:hover{color:#f1f5f9;}
  html[data-theme="dark"] .lang-inline .lang-opt.active{background:#1e293b;color:#f1f5f9;}
  @media (max-width:768px){ .lang-inline{display:none;} }
  </style>
</head>
<body class="app">
  <div class="shell">
    <button class="hamburger" onclick="toggleSidebar()" aria-label="菜单">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar">
      <a href="dashboard.html" class="brand">
        <span class="brand-mark">T</span>
        <span class="col" style="gap:1px;">
          <span class="brand-name">Token Station</span>
          <span class="brand-sub">工作区</span>
        </span>
      </a>
      <nav class="nav">
        <div class="nav-group-label">我的空间</div>
        <a href="dashboard.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>仪表盘</a>
        <a href="playground.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg></span>体验场</a>
        <a href="keys.html" class="nav-item active"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></span>API 密钥</a>
        <a href="models.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4 7.55 4.24"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>模型</a>
        <a href="usage.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>用量</a>
        <a href="profile.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>构建者画像</a>
        <a href="billing.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></span>账单</a>
        <div class="nav-group-label">参考</div>
        <a href="docs.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>文档</a>
      </nav>
      <div class="sidebar-foot">
        <div class="avatar xs green">D</div>
        <div class="who">
          <span class="who-name">dev@example.com</span>
          <a href="#" class="who-role" style="color:var(--text-3);">退出登录</a>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumbs"><span>工作区</span><span class="sep">›</span><span class="leaf">API 密钥</span></div>
        <div class="topbar-spacer"></div>
        <nav class="lang-inline" aria-label="语言"><a href="#" class="lang-opt" title="English"><span class="lang-g">EN</span></a><a href="#" class="lang-opt active" aria-current="true" title="简体中文"><span class="lang-g">简</span></a><a href="#" class="lang-opt" title="繁體中文"><span class="lang-g">繁</span></a><a href="#" class="lang-opt" title="日本語"><span class="lang-g">日</span></a><a href="#" class="lang-opt" title="한국어"><span class="lang-g">한</span></a></nav>
        <button type="button" class="theme-toggle topbar-icon" aria-label="切换主题">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m4.93 19.07 1.41-1.41"/><path d="m17.66 6.34 1.41-1.41"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="docs.html" class="topbar-icon" title="文档"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></a>
      </header>
      <div class="page">
        <div class="page-head">
            <div>
                <h1 class="page-title">编辑密钥 <span class="codeline">gw-a1b2c3d4…</span></h1>
            </div>
            <a href="keys.html" class="btn">返回密钥</a>
        </div>

        <div class="card">
            <div class="card-body">
                <form method="post" action="#" onsubmit="return false" enctype="multipart/form-data">
                    <div class="field">
                        <label class="label" for="name">密钥名称</label>
                        <input type="text" name="name" id="name" value="my-project" placeholder="例如 my-project" class="input">
                    </div>

                    <hr class="div">
                    <div class="card-title" style="margin-bottom:10px">WASM 中间件</div>
                    <div class="field"><span class="muted">当前 WASM：</span> <span class="codeline">complexity_router.wasm</span></div>
                    <label class="row" style="gap:8px; font-size:12px; color:var(--text-2); margin-top:6px">
                        <input type="checkbox" name="remove_wasm" value="1" style="width:auto"> 移除 WASM 中间件
                    </label>

                    <div class="field" style="margin-top:14px">
                        <label class="label" for="wasm_preset">选择 WASM 模块</label>
                        <select name="wasm_preset" id="wasm_preset" onchange="toggleCustomUpload()" class="select">
                            <option value="">— 无更改 —</option>
                            <option value="https://download.bytefuture.ai/complexity_router.wasm">Complexity Router — Auto-route to cheap/mid/premium models based on request complexity</option>
                            <option value="https://download.bytefuture.ai/echo_redirect.wasm">Echo Redirect — Example: echoes body unchanged, redirects to gpt-5-nano</option>
                            <option value="__custom__">上传你自己的…</option>
                        </select>
                    </div>

                    <div id="custom-upload" style="display:none">
                        <div class="field">
                            <label class="label" for="wasm_file">上传 WASM 文件（最大 5MB）</label>
                            <input type="file" name="wasm_file" id="wasm_file" accept=".wasm" class="input">
                        </div>
                        <div class="field">
                            <label class="label" for="wasm_url">或从 URL 加载</label>
                            <input type="url" name="wasm_url" id="wasm_url" placeholder="https://example.com/transform.wasm" class="input">
                        </div>
                    </div>

                    <script>
                    function toggleCustomUpload() {
                        var sel = document.getElementById('wasm_preset');
                        var box = document.getElementById('custom-upload');
                        box.style.display = sel.value === '__custom__' ? 'block' : 'none';
                    }
                    </script>

                    <div class="row" style="margin-top:18px; gap:8px">
                        <button type="submit" class="btn primary">保存更改</button>
                        <a href="keys.html" class="btn">取消</a>
                    </div>
                </form>
            </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../assets/app.js"></script>
</body>
</html>

[package]
name = "plan-responses"
version = "2.2.0"
edition = "2021"
publish = false

# A library shared by provider-chatgpt-plan-v2 and provider-copilot-plan-v2.
# It is not a component: it has no WIT exports and is not packaged on its own.
[workspace]

[dependencies]
serde_json = "1"
south-component-conformance = { version = "=0.81.1", git = "https://github.com/ballast-ai/token-station-south.git", rev = "174158d1abfc842cc47dc88c9c6ef0c18c0e4d2f", default-features = false }
south-provider-api = { version = "=0.65.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "174158d1abfc842cc47dc88c9c6ef0c18c0e4d2f" }
token-station-protocol = { version = "=0.7.0", git = "https://github.com/ballast-ai/token-station-kernel.git", rev = "ce6894d99f51283e4985d39a2d533307bda27b6a" }

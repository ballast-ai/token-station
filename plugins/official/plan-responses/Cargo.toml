[package]
name = "plan-responses"
version = "2.2.0"
edition = "2021"
publish = false

# A library shared by provider-chatgpt-plan-v2 and provider-copilot-plan-v2.
# It is not a component: it has no WIT exports and is not packaged on its own.
[workspace]

[dependencies]
serde_json = "1"
south-component-conformance = { version = "=0.82.1", git = "https://github.com/ballast-ai/token-station-south.git", rev = "d5fa458a561796d641efce2c308fa80ac294caf5", default-features = false }
south-provider-api = { version = "=0.66.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "d5fa458a561796d641efce2c308fa80ac294caf5" }
token-station-protocol = { version = "=0.7.0", git = "https://github.com/ballast-ai/token-station-kernel.git", rev = "ce6894d99f51283e4985d39a2d533307bda27b6a" }

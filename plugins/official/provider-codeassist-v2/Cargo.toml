[package]
name = "provider-codeassist-v2"
version = "2.2.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
serde_json = "1"
south-component-conformance = { version = "=0.82.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "bc07c516e3488b321eabf3a67e6a650ecbd6eeda", default-features = false }
south-provider-api = { version = "=0.66.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "bc07c516e3488b321eabf3a67e6a650ecbd6eeda" }
token-station-protocol = { version = "=0.7.0", git = "https://github.com/ballast-ai/token-station-kernel.git", rev = "ce6894d99f51283e4985d39a2d533307bda27b6a" }
wit-bindgen = "0.59"

[profile.release]
lto = "thin"
opt-level = "s"
strip = true

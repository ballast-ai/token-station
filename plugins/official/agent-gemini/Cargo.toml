# The official Gemini generateContent inbound agent adapter. It is standalone
# because official adapters compile to wasm32-wasip2 components.
[package]
name = "agent-gemini"
version = "1.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = "1"
serde_json = "1"
token-station-protocol = { path = "../../../crates/protocol" }
wit-bindgen = "0.59"

# The official OpenAI-compatible provider component, v2: the South-owned ABI
# (token-station:adapter@2.0.0, world provider-adapter-v2), compiled to a
# wasm32-wasip2 component. Standalone (not a workspace member): the main
# workspace must stay buildable without a wasm toolchain.
#
# The translation logic is south-component-conformance's reference
# implementation — the same code gate ② froze its fixture pack against — so
# this shell cannot drift from the judged behavior. The vendored
# wit/provider-adapter.wit is pinned byte-for-byte to
# south_provider_api::ADAPTER_WIT by this crate's test.
[package]
name = "provider-openai-compatible-v2"
version = "2.1.0"
edition = "2021"
publish = false

# Standalone: stops cargo from walking up into the main workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
south-component-conformance = { version = "=0.16.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "efbb9b655bf1b26ec639dd21bde7ade7fcdc11b8", default-features = false }
wit-bindgen = "0.59"

[dev-dependencies]
south-provider-api = { version = "=0.16.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "efbb9b655bf1b26ec639dd21bde7ade7fcdc11b8" }

[profile.release]
lto = "thin"
opt-level = "s"
strip = true

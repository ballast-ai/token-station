# The official Anthropic Messages inbound agent adapter, compiled to a
# `wasm32-wasip2` component. Standalone (not a workspace member): the main
# workspace must stay buildable without a wasm toolchain.
[package]
name = "agent-anthropic"
version = "1.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = "1"
serde_json = "1"
wit-bindgen = "0.59"

# The Messages codec comes from the same South revision as the host and the
# provider components (South 0.88.0), as in agent-openai and
# agent-openai-responses. The protocol crate is the kernel mirror South
# compiles against, so the codec and this adapter share one set of canonical
# types. Its sources equal this repository's crates/protocol 0.7.0.
south-north-codec = { version = "=0.88.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "bc07c516e3488b321eabf3a67e6a650ecbd6eeda" }
token-station-protocol = { version = "=0.7.0", git = "https://github.com/ballast-ai/token-station-kernel.git", rev = "ce6894d99f51283e4985d39a2d533307bda27b6a" }

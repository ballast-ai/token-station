# The official Anthropic Messages inbound agent adapter, compiled to a
# `wasm32-wasip2` component. Standalone (not a workspace member): the main
# workspace must stay buildable without a wasm toolchain.
[package]
name = "agent-anthropic"
version = "1.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = "1"
serde_json = "1"
token-station-protocol = { path = "../../../crates/protocol" }
wit-bindgen = "0.59"

# The official OpenAI Responses inbound agent adapter. It is a standalone
# wasm32-wasip2 guest so the main workspace does not require a WASM toolchain.
[package]
name = "agent-openai-responses"
version = "1.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = "1"
serde_json = "1"
wit-bindgen = "0.59"

# The Responses codec comes from the same South revision as the host and the
# provider components (South 0.85.1). The protocol crate is the kernel mirror
# South compiles against, so the codec and this adapter share one set of
# canonical types. Its sources equal this repository's crates/protocol 0.7.0.
south-north-codec = { version = "=0.85.1", git = "https://github.com/ballast-ai/token-station-south.git", rev = "174158d1abfc842cc47dc88c9c6ef0c18c0e4d2f" }
token-station-protocol = { version = "=0.7.0", git = "https://github.com/ballast-ai/token-station-kernel.git", rev = "ce6894d99f51283e4985d39a2d533307bda27b6a" }

# The official OpenAI-compatible inbound agent adapter, compiled to a
# `wasm32-wasip2` component. Standalone (not a workspace member): the main
# workspace must stay buildable without a wasm toolchain.
[package]
name = "agent-openai"
version = "1.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = "1"
# `preserve_order` keeps the codec's chunk key order (`id`, `object`,
# `created`, `model`, `choices`, `usage`) on the wire instead of sorting it.
serde_json = { version = "1", features = ["preserve_order"] }
wit-bindgen = "0.59"

# The Chat codec comes from the same South revision as the host and the
# provider components (South 0.88.1), as in agent-openai-responses. The
# protocol crate is the kernel mirror South compiles against, so the codec and
# this adapter share one set of canonical types. Its sources equal this
# repository's crates/protocol 0.7.0.
south-north-codec = { version = "=0.88.1", git = "https://github.com/ballast-ai/token-station-south.git", rev = "d5fa458a561796d641efce2c308fa80ac294caf5" }
token-station-protocol = { version = "=0.7.0", git = "https://github.com/ballast-ai/token-station-kernel.git", rev = "ce6894d99f51283e4985d39a2d533307bda27b6a" }

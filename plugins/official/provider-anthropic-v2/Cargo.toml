# The official Anthropic Messages provider component, v2: the South-owned ABI
# (token-station:adapter@2.0.0, world provider-adapter-v2), compiled to a
# wasm32-wasip2 component. Standalone (not a workspace member): the main
# workspace must stay buildable without a wasm toolchain.
#
# The translation logic is south-component-conformance's reference
# implementation — the same code gate ② froze its fixture pack against — so
# this shell keeps that behavior except for an explicit rejection of structured
# response formats that the reference cannot preserve. The vendored
# wit/provider-adapter.wit is pinned byte-for-byte to
# south_provider_api::ADAPTER_WIT by this crate's test.
[package]
name = "provider-anthropic-v2"
version = "1.4.11"
edition = "2021"
publish = false

# Standalone: stops cargo from walking up into the main workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
south-component-conformance = { version = "=0.81.1", git = "https://github.com/ballast-ai/token-station-south.git", rev = "174158d1abfc842cc47dc88c9c6ef0c18c0e4d2f", default-features = false }
wit-bindgen = "0.59"

[dev-dependencies]
south-provider-api = { version = "=0.65.0", git = "https://github.com/ballast-ai/token-station-south.git", rev = "174158d1abfc842cc47dc88c9c6ef0c18c0e4d2f" }

[profile.release]
lto = "thin"
opt-level = "s"
strip = true

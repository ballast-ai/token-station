<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token Station — Logo Exploration v2</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #eef1f6;
      --surface: #ffffff;
      --stage: #f4f6fa;
      --ink: #182133;
      --muted: #738096;
      --line: #dce2eb;
      --accent: #5368e8;
      --chip: #edf0ff;
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #0d1119;
      --surface: #171d28;
      --stage: #111620;
      --ink: #eef2f8;
      --muted: #929db0;
      --line: #2a3444;
      --accent: #7284ff;
      --chip: #252e4e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    button { font: inherit; }
    .shell { width: min(1540px, calc(100% - 40px)); margin: 0 auto; padding: 36px 0 72px; }
    .hero { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; margin-bottom: 36px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font: 650 11px/1.2 "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 68px); line-height: .98; letter-spacing: -.055em; }
    .lede { max-width: 780px; margin: 16px 0 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .toolbar button { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); padding: 9px 12px; cursor: pointer; }
    .toolbar button:hover { border-color: var(--accent); }
    .direction { margin-top: 42px; }
    .direction-head { display: grid; grid-template-columns: minmax(220px, 360px) 1fr; gap: 28px; align-items: end; padding-bottom: 15px; border-bottom: 1px solid var(--line); }
    .direction-index { color: var(--accent); font: 650 12px/1 "IBM Plex Mono", monospace; }
    h2 { margin: 7px 0 0; font-size: 25px; letter-spacing: -.035em; }
    .direction-head p { margin: 0; color: var(--muted); line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
    .card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .stage { min-height: 228px; display: grid; place-items: center; padding: 28px; background: var(--stage); }
    .stage img { width: min(var(--mark-size, 178px), 100%); height: auto; max-height: 178px; object-fit: contain; }
    .meta { padding: 14px 14px 12px; border-top: 1px solid var(--line); }
    .id { display: inline-block; margin-bottom: 7px; padding: 3px 6px; border-radius: 5px; color: var(--accent); background: var(--chip); font: 650 10px/1.2 "IBM Plex Mono", monospace; }
    .name { display: block; font-size: 14px; font-weight: 650; letter-spacing: -.015em; }
    .en { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .sizes { display: flex; gap: 10px; align-items: end; min-height: 72px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); }
    .sizes span { display: grid; justify-items: center; gap: 4px; color: var(--muted); font: 9px/1 "IBM Plex Mono", monospace; }
    .sizes img { object-fit: contain; }
    .note { margin-top: 34px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: var(--surface); line-height: 1.65; }
    @media (max-width: 1180px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 760px) {
      .shell { width: min(100% - 24px, 1540px); padding-top: 24px; }
      .hero, .direction-head { grid-template-columns: 1fr; }
      .toolbar { justify-content: flex-start; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 470px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Imagegen ideation × vector production</p>
        <h1>Token Station<br>Logo Exploration v2</h1>
        <p class="lede">5 个视觉方向，25 个独立候选。每张先由 imagegen 做轮廓发散，再重绘为平面 SVG；切换主题时会同步加载经过对比度修正的深色版本，并检查大图、64px、32px 与 16px 表现。</p>
      </div>
      <div class="toolbar" aria-label="Preview controls">
        <button type="button" data-size="128">紧凑</button>
        <button type="button" data-size="178">标准</button>
        <button type="button" data-size="212">放大</button>
        <button type="button" id="theme">切换深浅背景</button>
      </div>
    </header>
    <div id="gallery"></div>
    <p class="note">概念图不是最终商标审查结论。正式替换前仍需从候选中收敛 1 个方向，完成几何微调、单色托盘版、明暗 Dock 版、商标近似检索与完整 Tauri 图标资产导出。</p>
  </main>
  <script>
    const directions = [
      {
        id: "01", cn: "切轨印记", en: "Switch Cut",
        note: "保留现有黑橙换轨 DNA，但从‘线路示意图’压缩成一个决断性的切口与主轮廓。",
        dir: "direction-01-switch-cut",
        items: [
          ["D01-01", "中继斜切", "Relay Slash", "d01-01-relay-slash"],
          ["D01-02", "换线楔", "Switch Wedge", "d01-02-switch-wedge"],
          ["D01-03", "TS 切口", "TS Cut", "d01-03-ts-cut"],
          ["D01-04", "交叉闸", "Crossing Gate", "d01-04-crossing-gate"],
          ["D01-05", "信号缝", "Signal Stitch", "d01-05-signal-stitch"]
        ]
      },
      {
        id: "02", cn: "本地孔径", en: "Local Aperture",
        note: "用一个厚实边界和唯一受控入口表达 local-first，不使用盾牌、锁、房屋或刷新箭头。",
        dir: "direction-02-local-aperture",
        items: [
          ["D02-01", "回环孔径", "Loopback Aperture", "d02-01-loopback-aperture"],
          ["D02-02", "私有端口", "Private Port", "d02-02-private-port"],
          ["D02-03", "内含流", "Contained Flow", "d02-03-contained-flow"],
          ["D02-04", "边界槽", "Boundary Slot", "d02-04-boundary-slot"],
          ["D02-05", "内核折带", "Kernel Fold", "d02-05-kernel-fold"]
        ]
      },
      {
        id: "03", cn: "双轨换线", en: "Dual-track Exchange",
        note: "两条恒定宽度的轨带围绕方形负空间互换位置，不画箭头、节点、环或字母。",
        dir: "direction-03-dual-track-exchange",
        items: [
          ["D03-01", "方核交汇", "Square Crossover", "d03-01-square-crossover"],
          ["D03-02", "偏移换线", "Offset Exchange", "d03-02-offset-exchange"],
          ["D03-03", "中继对", "Relay Pair", "d03-03-relay-pair"],
          ["D03-04", "站台换乘", "Platform Transfer", "d03-04-platform-transfer"],
          ["D03-05", "后备接管", "Fallback Switch", "d03-05-fallback-switch"]
        ]
      },
      {
        id: "04", cn: "令牌机架", en: "Token Rack",
        note: "把 token 解释为可被机器读取、装载和切换的数据单元，而不是金币、电池或额度图表。",
        dir: "direction-04-token-rack",
        items: [
          ["D04-01", "穿孔单元", "Perforated Unit", "d04-01-perforated-unit"],
          ["D04-02", "错位匣片", "Offset Cartridges", "d04-02-offset-cartridges"],
          ["D04-03", "槽位节拍", "Slot Register", "d04-03-slot-register"],
          ["D04-04", "包中继", "Packet Relay", "d04-04-packet-relay"],
          ["D04-05", "计量切口", "Meter Cut", "d04-05-meter-cut"]
        ]
      },
      {
        id: "05", cn: "精密信号", en: "Signal Control",
        note: "借鉴工业控制件与瑞士导视的克制比例，用断点、门闩和档位表达可控与可靠。",
        dir: "direction-05-signal-control",
        items: [
          ["D05-01", "信号断点", "Signal Break", "d05-01-signal-break"],
          ["D05-02", "控制门闩", "Gate Latch", "d05-02-gate-latch"],
          ["D05-03", "档位杆", "Detent Lever", "d05-03-detent-lever"],
          ["D05-04", "中继旗", "Relay Flag", "d05-04-relay-flag"],
          ["D05-05", "静默信标", "Quiet Beacon", "d05-05-quiet-beacon"]
        ]
      }
    ];

    const card = (dir, item) => {
      const [id, cn, en, file] = item;
      const src = `${dir}/${file}.svg`;
      const darkSrc = `dark-variants/${dir}/${file}.svg`;
      return `<article class="card">
        <a class="stage" href="${src}" data-light="${src}" data-dark="${darkSrc}" target="_blank" rel="noreferrer"><img src="${src}" data-light="${src}" data-dark="${darkSrc}" alt="${id} ${cn}"></a>
        <div class="meta"><span class="id">${id}</span><span class="name">${cn}</span><span class="en">${en}</span>
          <div class="sizes" aria-label="Small size check">
            ${[64, 32, 16].map(size => `<span><img src="${src}" data-light="${src}" data-dark="${darkSrc}" width="${size}" height="${size}" alt="">${size}</span>`).join("")}
          </div>
        </div>
      </article>`;
    };

    document.querySelector("#gallery").innerHTML = directions.map(direction => `
      <section class="direction">
        <header class="direction-head"><div><span class="direction-index">DIRECTION ${direction.id}</span><h2>${direction.cn} · ${direction.en}</h2></div><p>${direction.note}</p></header>
        <div class="grid">${direction.items.map(item => card(direction.dir, item)).join("")}</div>
      </section>`).join("");

    document.querySelectorAll("[data-size]").forEach(button => button.addEventListener("click", () => {
      document.documentElement.style.setProperty("--mark-size", `${button.dataset.size}px`);
    }));
    const applyTheme = theme => {
      document.documentElement.dataset.theme = theme;
      document.querySelectorAll("[data-light][data-dark]").forEach(element => {
        const next = element.dataset[theme];
        if (element instanceof HTMLAnchorElement) element.href = next;
        else element.src = next;
      });
    };

    document.querySelector("#theme").addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });
  </script>
</body>
</html>
